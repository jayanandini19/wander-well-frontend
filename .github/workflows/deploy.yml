name: Deploy to github Pages

on:
  push:
    branches: 'main'
permissions: 
  contents: read
  pages: write
  id-tokens: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
     environment:
       name: github-pages
       url: ${{ steps.deployments.outputs.page_url }}
     runs-on: ubuntu-latest
     steps:
       - name: Checkout
         uses: actions/checkout@v4

       - name: Set up Node
         uses: actions/setup-node@v4
         with: 
           node-version:20
           cache: 'npm'

       - name: Install dependencies 
         run: npm ci

       - name: Build project
         run: npm run build

       - name: Upload artifact
         uses: actions/upload-pages-artifact@v3
         with: 
           path: './dist' # Change to './build' if your project uses Create React App instead of Vite

       - name: Deploy to GitHubPages
         id: deployment
         uses: actions/deploy-pages@v4
